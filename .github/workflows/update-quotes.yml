name: Update stock data

on:
  schedule:
    # Runs once a day at 13:00 UTC (~9am ET / 6am PT), after US markets have
    # settled overnight moves. Cron is UTC — adjust the hour to taste.
    #
    # DAILY:        - cron: '0 13 * * *'
    # EVERY OTHER DAY (Mon/Wed/Fri, ~every other weekday):
    #               - cron: '0 13 * * 1,3,5'
    - cron: '0 13 * * *'
  workflow_dispatch: {}   # lets you trigger a manual refresh from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest quotes
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node fetch-quotes.js

      - name: Check for alert conditions
        run: node send-alerts.js

      - name: Check whether an alert was triggered
        id: alert
        run: |
          if [ -s alert-summary.md ]; then
            echo "triggered=true" >> "$GITHUB_OUTPUT"
          else
            echo "triggered=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send alert email
        if: steps.alert.outputs.triggered == 'true'
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Dashboard Alert — ${{ github.run_id }}"
          to: ${{ secrets.MAIL_TO }}
          from: Data Center Dashboard
          body: file://alert-summary.md

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json history.json alert-state.json
          git diff --quiet --cached || git commit -m "Update stock data $(date -u +'%Y-%m-%d')"
          git push
